{% extends "profile/layout.html" %}

{% block profile_content %}
<div class="card" style="border: 1px solid #e8e8e8; border-radius: 4px;">
  <div class="card-body" style="padding: 2rem;">
    <h2 style="margin-bottom: 0.5rem; color: #333; font-size: 1.5rem;">Đổi mật khẩu</h2>
    <p style="color: #757575; margin-bottom: 2rem;">Để bảo mật tài khoản, vui lòng đặt mật khẩu có ít nhất 6 ký tự</p>
    
    <form method="POST">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label style="color: #333; font-weight: 500; margin-bottom: 0.5rem;">Mật khẩu hiện tại</label>
        <input type="password" name="old_password" class="form-control" required style="border: 1px solid #e8e8e8; padding: 0.75rem; border-radius: 4px;">
      </div>
      
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label style="color: #333; font-weight: 500; margin-bottom: 0.5rem;">Mật khẩu mới</label>
        <input type="password" name="new_password" class="form-control" required minlength="6" style="border: 1px solid #e8e8e8; padding: 0.75rem; border-radius: 4px;">
      </div>
      
      <div class="form-group" style="margin-bottom: 2rem;">
        <label style="color: #333; font-weight: 500; margin-bottom: 0.5rem;">Xác nhận mật khẩu mới</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6" style="border: 1px solid #e8e8e8; padding: 0.75rem; border-radius: 4px;">
      </div>
      
      <button type="submit" class="btn" style="background-color: #ee4d2d; color: white; padding: 0.75rem 2rem; border: none; border-radius: 4px; font-weight: 500;">
        Lưu
      </button>
    </form>
  </div>
</div>
{% endblock %}
