{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="container" style="max-width:420px;padding:3rem 1rem;">
  <div class="card" style="padding:2rem;">
    <h1 style="margin:0 0 .5rem;font-size:1.5rem;">Đăng nhập</h1>
    <p style="color:#64748b;margin:0 0 1.5rem;">Sàn TMĐT Gia Dụng Pro</p>
    <form method="post">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" name="email" required placeholder="admin@ecommerce.vn">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input class="form-control" type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Đăng nhập</button>
    </form>
    <p style="margin-top:1rem;text-align:center;font-size:.9rem;">
      Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký</a>
    </p>
  </div>
</div>
{% endblock %}
