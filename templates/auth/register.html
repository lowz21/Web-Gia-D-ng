{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="container" style="max-width:420px;padding:3rem 1rem;">
  <div class="card" style="padding:2rem;">
    <h1 style="margin:0 0 .5rem;font-size:1.5rem;">Đăng ký tài khoản</h1>
    <form method="post">
      <div class="form-group"><label>Họ tên</label><input class="form-control" name="name" required></div>
      <div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" required></div>
      <div class="form-group"><label>Số điện thoại</label><input class="form-control" name="phone"></div>
      <div class="form-group"><label>Mật khẩu</label><input class="form-control" type="password" name="password" required></div>
      <div class="form-group"><label>Xác nhận mật khẩu</label><input class="form-control" type="password" name="confirm" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Đăng ký</button>
    </form>
    <p style="margin-top:1rem;text-align:center;font-size:.9rem;">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a></p>
  </div>
</div>
{% endblock %}
