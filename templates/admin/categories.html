{% extends "admin/layout.html" %}
{% block admin_content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
  <h1 class="page-title" style="margin:0;">Quản lý danh mục</h1>
  <a href="{{ url_for('admin.category_add') }}" class="btn btn-primary">+ Thêm danh mục</a>
</div>
<div class="table-wrap">
  <table>
    <thead><tr><th>ID</th><th>Tên danh mục</th><th>Slug</th><th>Mô tả</th><th></th></tr></thead>
    <tbody>
      {% for c in categories %}
      <tr>
        <td>{{ c.MaDanhMuc }}</td>
        <td>{{ c.TenDanhMuc }}</td>
        <td>{{ c.Slug }}</td>
        <td>{{ c.MoTa }}</td>
        <td>
          <a href="{{ url_for('admin.category_edit', cat_id=c.MaDanhMuc) }}" class="btn btn-outline btn-sm">Sửa</a>
          <form action="{{ url_for('admin.category_delete', cat_id=c.MaDanhMuc) }}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Xóa danh mục?')">Xóa</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
